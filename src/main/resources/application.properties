spring.application.name=Fulvo-backend

# DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.defaultschema=main
spring.datasource.driverClassName=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Esta sentencia actualiza la base de datos en caso de que haya cambios en las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT
security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.issuer=Main
# security.jwt.ttlMillis= millis * minutes * hours
security.jwt.ttlMillis= 1000*60*24
